[project]
name = "bugpacket"
version = "0.1.0"
description = "Turn a software failure into the smallest useful debugging context for an AI coding agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Andre Ruiz Loera", email = "andre.x.ruizloera@gmail.com" }]
keywords = ["debugging", "ai-agents", "developer-tools", "llm", "context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/andreruizloera/bugpacket"
Issues = "https://github.com/andreruizloera/bugpacket/issues"

[project.scripts]
bugpacket = "bugpacket.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bugpacket"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
